networks:
  backend:
    internal: true
  frontend:

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 100M

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 30M

  migrate:
    build: .
    command: alembic upgrade head
    volumes:
      - ./alembic:/app/alembic
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 100M

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 80M

  worker:
    build: .
    command: celery -A app.celery.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    restart: always
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 150M

  beat:
    build: .
    command: celery -A app.celery.celery_app beat --loglevel=info
    env_file:
      - .env
    restart: always
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 60M

  flower:
    build: .
    command: celery -A app.celery.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    restart: always
    networks:
      - backend
      - frontend
    depends_on:
      - redis
      - worker
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 60M

volumes:
  postgres_data:
